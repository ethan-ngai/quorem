services:
  mailpit:
    image: axllent/mailpit:v1.33.1@sha256:aef2aacc11f075ec0fb6874275ee4a421e688e11a96ebb296134d1735c7761ce
    profiles: [mailer]
    ports:
      - "127.0.0.1:51025:1025"
      - "127.0.0.1:58025:8025"
    environment:
      MP_MAX_MESSAGES: 500
      MP_DATABASE: /data/mailpit.db
    volumes:
      - mailpit-data:/data
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 2s
      timeout: 3s
      retries: 30
  garage:
    image: dxflrs/garage:v2.5.0@sha256:677e5b758e4425a325b811c425c026bf35a4bf42f7ddbaa773de3f4fd779a5a5
    profiles: [storage]
    command: ["/garage", "server", "--single-node", "--default-bucket"]
    environment:
      GARAGE_DEFAULT_ACCESS_KEY: ${AVATAR_S3_ACCESS_KEY_ID:-}
      GARAGE_DEFAULT_SECRET_KEY: ${AVATAR_S3_SECRET_ACCESS_KEY:-}
      GARAGE_DEFAULT_BUCKET: ${AVATAR_S3_BUCKET:-quorem-avatars}
    ports:
      - "127.0.0.1:53900:3900"
    volumes:
      - ./.local/garage.toml:/etc/garage.toml:ro
      - garage-data:/var/lib/garage
    healthcheck:
      test: ["CMD", "/garage", "status"]
      interval: 2s
      timeout: 3s
      retries: 30
  postgres:
    image: postgres:17.11-alpine
    environment:
      POSTGRES_USER: quorem
      POSTGRES_PASSWORD: quorem
      POSTGRES_DB: quorem
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quorem -d quorem"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  postgres-data:
  garage-data:
  mailpit-data:
