services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_USER: quorem
      POSTGRES_PASSWORD: quorem
      POSTGRES_DB: quorem
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quorem -d quorem"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  postgres-data:
