services:
  garage:
    image: dxflrs/garage:v2.4.1@sha256:9c96caa2612d3411acc5b0e6701fb238dbfba33e533a6d7d3d811a4b12d0d020
    profiles: [storage]
    command: ["/garage", "server", "--single-node", "--default-bucket"]
    environment:
      GARAGE_DEFAULT_ACCESS_KEY: ${AVATAR_S3_ACCESS_KEY_ID:-}
      GARAGE_DEFAULT_SECRET_KEY: ${AVATAR_S3_SECRET_ACCESS_KEY:-}
      GARAGE_DEFAULT_BUCKET: ${AVATAR_S3_BUCKET:-quorem-avatars}
    ports:
      - "127.0.0.1:53900:3900"
    volumes:
      - ./.local/garage.toml:/etc/garage.toml:ro
      - garage-data:/var/lib/garage
    healthcheck:
      test: ["CMD", "/garage", "status"]
      interval: 2s
      timeout: 3s
      retries: 30
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_USER: quorem
      POSTGRES_PASSWORD: quorem
      POSTGRES_DB: quorem
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quorem -d quorem"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  postgres-data:
  garage-data:
