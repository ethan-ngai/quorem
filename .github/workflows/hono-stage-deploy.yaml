name: Hono staged deployment
on:
  push:
    branches: [feat/hono-migration]
    paths: [deploy/hono/stage-request.json]
  workflow_dispatch:
    inputs:
      action:
        description: Plan bootstrap or provision and activate a fresh isolated stage
        type: choice
        options: [plan, stage]
        default: plan
        required: true
      release_sha:
        description: Exact migration-branch workflow revision
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: hono-stage-deployment
  cancel-in-progress: false
jobs:
  preflight:
    if: github.ref == 'refs/heads/feat/hono-migration'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
      - name: Read-only provider prerequisites
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
          HONO_BOOTSTRAP_ACTION: ${{ inputs.action || 'stage' }}
        run: node scripts/hono-stage-provider-check.mjs
  validate:
    if: github.ref == 'refs/heads/feat/hono-migration' && (github.event_name == 'push' || inputs.release_sha == github.sha)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_USER: fixture
          POSTGRES_PASSWORD: fixture
          POSTGRES_DB: quorem_hono_runtime_test
        ports: ["54329:5432"]
        options: >-
          --health-cmd "pg_isready -U fixture -d quorem_hono_runtime_test"
          --health-interval 2s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
      - uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af
        with:
          node-version-file: .node-version
          cache: true
          run-install: false
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd
        with:
          terraform_version: 1.13.5
          terraform_wrapper: false
      - run: vp install --frozen-lockfile
      - run: vp check --no-fmt
      - run: vp run contracts:check
      - run: vp -C apps/api run typecheck
      - run: vp -C apps/api run check:boundaries
      - run: docker build -f apps/runner/Dockerfile -t quorem-python:local .
      - name: Composed runtime release validation
        env:
          QUOREM_RUNTIME_TEST_URL: postgres://fixture:fixture@127.0.0.1:54329/quorem_hono_runtime_test?sslmode=disable
          QUOREM_TEST_DOCKER_SOCKET: /var/run/docker.sock
          WRANGLER_SEND_METRICS: "false"
        run: vp -C apps/api exec node src/runtime/composition/run-validation.mjs
      - run: node scripts/hono-container-validation.mjs
      - name: Private runner process contracts
        env:
          QUOREM_TEST_DOCKER_SOCKET: /var/run/docker.sock
        run: vp -C apps/runner exec node --test src/runtime/runtime.test.ts
      - run: node scripts/hono-stage-validation.mjs
      - run: node scripts/hono-recovery-validation.mjs
      - name: Terraform checks
        run: |
          for stack in hono-bootstrap hono-stage hono-services; do
            terraform -chdir=infra/terraform/$stack fmt -check -recursive
            terraform -chdir=infra/terraform/$stack init -backend=false -input=false
            terraform -chdir=infra/terraform/$stack validate
            terraform -chdir=infra/terraform/$stack test
          done
  bootstrap:
    needs: [validate, preflight]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: hono-stage
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_USER: fixture
          POSTGRES_PASSWORD: fixture
          POSTGRES_DB: quorem_hono_remote_validation_test
        ports: ["54329:5432"]
        options: >-
          --health-cmd "pg_isready -U fixture -d quorem_hono_remote_validation_test"
          --health-interval 2s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
      - uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af
        with:
          node-version-file: .node-version
          cache: true
          run-install: false
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd
        with:
          terraform_version: 1.13.5
          terraform_wrapper: false
      - run: vp install --frozen-lockfile
      - name: Provision and validate isolated Hono stage
        env:
          HONO_BOOTSTRAP_ACTION: ${{ inputs.action || 'stage' }}
          HONO_RELEASE_SHA: ${{ inputs.release_sha || github.sha }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_ZONE_ID: ${{ vars.CLOUDFLARE_ZONE_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
          QUOREM_REMOTE_VALIDATION_DATABASE_URL: postgres://fixture:fixture@127.0.0.1:54329/quorem_hono_remote_validation_test?sslmode=disable
          WRANGLER_SEND_METRICS: "false"
        run: vp exec node scripts/hono-stage-launch.mjs
