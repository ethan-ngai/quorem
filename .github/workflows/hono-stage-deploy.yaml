name: Hono staged deployment
on:
  workflow_dispatch:
    inputs:
      action:
        description: Plan staged resources; stage remains disabled pending hosted proof
        type: choice
        options: [plan, stage]
        default: plan
        required: true
      case_namespace:
        description: Expected signed namespace, or 64 zeros only for first bootstrap
        type: string
        required: true
      release_sha:
        description: Exact migration-branch workflow revision
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: hono-stage-deployment
  cancel-in-progress: false
jobs:
  validate:
    if: github.ref == 'refs/heads/feat/hono-migration' && inputs.release_sha == github.sha
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_USER: fixture
          POSTGRES_PASSWORD: fixture
          POSTGRES_DB: quorem_hono_runtime_test
        ports: ["54329:5432"]
        options: >-
          --health-cmd "pg_isready -U fixture -d quorem_hono_runtime_test"
          --health-interval 2s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
      - uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af
        with:
          node-version-file: .node-version
          cache: true
          run-install: false
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd
        with:
          terraform_version: 1.13.5
          terraform_wrapper: false
      - run: vp install --frozen-lockfile
      - run: vp check --no-fmt
      - run: vp run contracts:check
      - run: vp -C apps/api run typecheck
      - run: docker build -f apps/runner/Dockerfile -t quorem-python:local .
      - name: Composed runtime release validation
        env:
          QUOREM_RUNTIME_TEST_URL: postgres://fixture:fixture@127.0.0.1:54329/quorem_hono_runtime_test?sslmode=disable
          QUOREM_TEST_DOCKER_SOCKET: /var/run/docker.sock
          WRANGLER_SEND_METRICS: "false"
        run: vp -C apps/api exec node src/runtime/composition/run-validation.mjs
      - run: node scripts/hono-container-validation.mjs
      - run: node --test scripts/hono-stage-deploy-pin.test.mjs scripts/hono-stage-deploy-proof.test.mjs scripts/hono-stage-deploy-acceptance.test.mjs scripts/hono-stage-deploy-ingress.test.mjs scripts/hono-stage-deploy-queue.test.mjs scripts/hono-stage-deploy-images.test.mjs scripts/hono-stage-deploy-secrets.test.mjs scripts/hono-stage-deploy.test.mjs scripts/hono-stage-config.test.mjs scripts/hono-stage-secrets.test.mjs scripts/hono-stage-preflight.test.mjs scripts/hono-stage-gate.test.mjs
      - name: Terraform checks
        run: |
          for stack in hono-stage hono-services; do
            terraform -chdir=infra/terraform/$stack fmt -check -recursive
            terraform -chdir=infra/terraform/$stack init -backend=false -input=false
            terraform -chdir=infra/terraform/$stack validate
            terraform -chdir=infra/terraform/$stack test
          done
  plan:
    needs: validate
    if: inputs.action == 'plan'
    runs-on: ubuntu-latest
    environment: hono-stage-plan
    env:
      HONO_STAGE_ACTION: plan
      HONO_RELEASE_SHA: ${{ inputs.release_sha }}
      HONO_SERVICES_WORKER_NAME: ${{ vars.HONO_SERVICES_WORKER_NAME }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      TF_STATE_BUCKET: ${{ vars.HONO_STAGE_STATE_BUCKET }}
      TF_IN_AUTOMATION: "true"
      TF_VAR_account_id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      TF_VAR_zone_id: ${{ vars.CLOUDFLARE_ZONE_ID }}
      TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      TF_VAR_worker_name: ${{ vars.HONO_STAGE_WORKER_NAME }}
      TF_VAR_stage_hostname: ${{ vars.HONO_STAGE_HOSTNAME }}
      TF_VAR_drain_hostname: ${{ vars.HONO_DRAIN_HOSTNAME }}
      TF_VAR_access_service_token_ids: ${{ vars.HONO_API_ACCESS_TOKEN_IDS }}
      TF_VAR_drain_access_service_token_id: ${{ vars.HONO_DRAIN_ACCESS_TOKEN_ID }}
      TF_VAR_database_host: ${{ vars.HONO_STAGE_DATABASE_HOST }}
      TF_VAR_database_port: ${{ vars.HONO_STAGE_DATABASE_PORT }}
      TF_VAR_database_name: quorem_hono_stage
      TF_VAR_database_user: ${{ secrets.HONO_STAGE_DATABASE_USER }}
      TF_VAR_database_password: ${{ secrets.HONO_STAGE_DATABASE_PASSWORD }}
      TF_VAR_database_connection_limit: ${{ vars.HONO_STAGE_DATABASE_CONNECTION_LIMIT }}
      TF_VAR_enable_queue_consumer: "false"
      TF_VAR_hostnames: ${{ vars.HONO_SERVICE_HOSTNAMES }}
      TF_VAR_dns_target: ${{ vars.HONO_SERVICE_DNS_TARGET }}
      TF_VAR_access_token_ids: ${{ vars.HONO_SERVICE_ACCESS_TOKEN_IDS }}
      TF_VAR_runner_image: ${{ vars.HONO_RUNNER_IMAGE }}
      TF_VAR_verifier_image: ${{ vars.HONO_VERIFIER_IMAGE }}
      TF_VAR_case_images: ${{ vars.HONO_CASE_IMAGES }}
      TF_VAR_command_origin: ${{ vars.HONO_STAGE_API_ORIGIN }}
      TF_VAR_source_origin: ${{ vars.HONO_STAGE_API_ORIGIN }}
      TF_VAR_case_namespace_id: ${{ inputs.case_namespace }}
      TF_VAR_service_secrets: ${{ secrets.HONO_STAGE_SERVICE_SECRETS }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd
        with:
          terraform_version: 1.13.5
          terraform_wrapper: false
      - run: node scripts/hono-stage-deploy.mjs
  stage:
    needs: validate
    if: inputs.action == 'stage'
    runs-on: ubuntu-latest
    environment: hono-stage
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
      - name: Refuse stage until signed hosted validation exists
        run: |
          echo 'Stage deployment is disabled pending signed namespace and hosted execution proof.'
          exit 1
