name: Hono staged deployment
on:
  push:
    branches: [feat/hono-migration]
    paths: [deploy/hono/stage-request.json]
  workflow_dispatch:
    inputs:
      action:
        description: Plan bootstrap or provision and activate a fresh isolated stage
        type: choice
        options: [plan, stage, diagnose, rehearse-role, probe-role, fence-role, reset-api]
        default: plan
        required: true
      release_sha:
        description: Exact migration-branch workflow revision
        type: string
        required: true
      target_release:
        description: Failed staged release to inspect (diagnose only)
        type: string
        required: false
      resume_initialization:
        description: Allow verified empty migration-only database after a failed first initialization
        type: boolean
        default: false
        required: false
permissions:
  contents: read
concurrency:
  group: hono-stage-deployment
  cancel-in-progress: false
jobs:
  diagnose:
    if: github.ref == 'refs/heads/feat/hono-migration' && (inputs.action == 'diagnose' || inputs.action == 'rehearse-role' || inputs.action == 'probe-role' || inputs.action == 'fence-role' || inputs.action == 'reset-api') && inputs.release_sha == github.sha
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: hono-stage
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
      - uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af
        with:
          node-version-file: .node-version
          cache: true
          run-install: false
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd
        with:
          terraform_version: 1.13.5
          terraform_wrapper: false
      - run: vp install --frozen-lockfile
      - name: Inspect staged role (probe fences the created login after verification)
        env:
          HONO_STAGE_INSPECTION_ACTION: ${{ inputs.action }}
          HONO_RELEASE_SHA: ${{ inputs.release_sha }}
          HONO_DIAGNOSE_RELEASE_SHA: ${{ inputs.target_release }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
        run: vp exec node scripts/hono-stage-role-diagnostics.mjs
  preflight:
    if: github.ref == 'refs/heads/feat/hono-migration' && inputs.action != 'diagnose' && inputs.action != 'rehearse-role' && inputs.action != 'probe-role' && inputs.action != 'fence-role' && inputs.action != 'reset-api'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
      - name: Read-only provider prerequisites
        env:
          HONO_STAGE_INITIALIZATION_RESUME: ${{ inputs.resume_initialization && 'true' || 'false' }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
          HONO_BOOTSTRAP_ACTION: ${{ inputs.action || 'stage' }}
          HONO_RELEASE_SHA: ${{ inputs.release_sha || github.sha }}
        run: node scripts/hono-stage-provider-check.mjs
  validate:
    if: github.ref == 'refs/heads/feat/hono-migration' && inputs.action != 'plan' && inputs.action != 'diagnose' && inputs.action != 'rehearse-role' && inputs.action != 'probe-role' && inputs.action != 'fence-role' && inputs.action != 'reset-api' && (github.event_name == 'push' || inputs.release_sha == github.sha)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_USER: fixture
          POSTGRES_PASSWORD: fixture
          POSTGRES_DB: quorem_hono_runtime_test
        ports: ["54329:5432"]
        options: >-
          --health-cmd "pg_isready -U fixture -d quorem_hono_runtime_test"
          --health-interval 2s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
      - uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af
        with:
          node-version-file: .node-version
          cache: true
          run-install: false
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd
        with:
          terraform_version: 1.13.5
          terraform_wrapper: false
      - run: vp install --frozen-lockfile
      - run: vp check --no-fmt
      - run: vp run contracts:check
      - run: vp -C apps/api run typecheck
      - run: vp -C apps/api run check:boundaries
      - run: node scripts/hono-stage-validation.mjs
      - name: Terraform checks
        run: |
          for stack in hono-bootstrap hono-stage hono-services; do
            terraform -chdir=infra/terraform/$stack fmt -check -recursive
            terraform -chdir=infra/terraform/$stack init -backend=false -input=false
            terraform -chdir=infra/terraform/$stack validate
            terraform -chdir=infra/terraform/$stack test
          done
          node --test infra/terraform/hono-bootstrap/tests/rest-identity.test.mjs
  bootstrap:
    needs: [validate, preflight]
    if: always() && github.ref == 'refs/heads/feat/hono-migration' && needs.preflight.result == 'success' && (inputs.action == 'plan' || needs.validate.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: hono-stage
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_USER: fixture
          POSTGRES_PASSWORD: fixture
          POSTGRES_DB: quorem_hono_remote_validation_test
        ports: ["54329:5432"]
        options: >-
          --health-cmd "pg_isready -U fixture -d quorem_hono_remote_validation_test"
          --health-interval 2s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
      - uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af
        with:
          node-version-file: .node-version
          cache: true
          run-install: false
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd
        with:
          terraform_version: 1.13.5
          terraform_wrapper: false
      - run: vp install --frozen-lockfile
      - name: Provision and validate isolated Hono stage
        env:
          HONO_STAGE_INITIALIZATION_RESUME: ${{ inputs.resume_initialization && 'true' || 'false' }}
          HONO_BOOTSTRAP_ACTION: ${{ inputs.action || 'stage' }}
          HONO_RELEASE_SHA: ${{ inputs.release_sha || github.sha }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_ZONE_ID: ${{ vars.CLOUDFLARE_ZONE_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
          QUOREM_REMOTE_VALIDATION_DATABASE_URL: postgres://fixture:fixture@127.0.0.1:54329/quorem_hono_remote_validation_test?sslmode=disable
          WRANGLER_SEND_METRICS: "false"
        run: vp exec node scripts/hono-stage-launch.mjs
