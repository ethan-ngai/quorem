name: Deploy production
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
env:
  AUTH_ORIGIN: https://${{ vars.PRODUCTION_DOMAIN || 'quorem.app' }}
  QUOREM_TEST_DATABASE_URL: postgres://quorem:quorem@127.0.0.1:54329/quorem_test?sslmode=disable
  AUTH_TEST_DATABASE_URL: postgres://quorem:quorem@127.0.0.1:54329/quorem_test?sslmode=disable
  TF_IN_AUTOMATION: "true"
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
  NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
  AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
  TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
  TF_VAR_account_id: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
  TF_VAR_zone_id: ${{ vars.CLOUDFLARE_ZONE_ID || secrets.CLOUDFLARE_ZONE_ID }}
  TF_VAR_domain: ${{ vars.PRODUCTION_DOMAIN || 'quorem.app' }}
  TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  TF_VAR_better_auth_secret: ${{ secrets.BETTER_AUTH_SECRET }}
  TF_VAR_auth_internal_secret: ${{ secrets.AUTH_INTERNAL_SECRET }}
  TF_VAR_invite_key: ${{ secrets.QUOREM_INVITE_KEY }}
  APP_ENV: local
  BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
  AUTH_INTERNAL_SECRET: ${{ secrets.AUTH_INTERNAL_SECRET }}
  QUOREM_INVITE_KEY: ${{ secrets.QUOREM_INVITE_KEY }}
  WRANGLER_SEND_METRICS: "false"
jobs:
  build:
    outputs:
      image_sha: ${{ steps.validation.outputs.image_sha }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_USER: quorem
          POSTGRES_PASSWORD: quorem
          POSTGRES_DB: quorem_test
        ports:
          - 54329:5432
        options: >-
          --health-cmd "pg_isready -U quorem -d quorem_test"
          --health-interval 2s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Check deployment configuration
        if: github.ref == 'refs/heads/main'
        env:
          AUTH_BOOTSTRAP_PASSWORD: ${{ secrets.AUTH_BOOTSTRAP_PASSWORD }}
          PRIVATE_QUESTION_JSON: ${{ secrets.PRIVATE_QUESTION_JSON }}
        run: |
          python3 - <<'PY'
          import os
          required = ['CLOUDFLARE_API_TOKEN', 'CLOUDFLARE_ACCOUNT_ID', 'NEON_API_KEY',
                      'AWS_ACCESS_KEY_ID', 'AWS_SECRET_ACCESS_KEY', 'TF_VAR_zone_id',
                      'BETTER_AUTH_SECRET', 'AUTH_INTERNAL_SECRET', 'QUOREM_INVITE_KEY',
                      'AUTH_BOOTSTRAP_PASSWORD', 'PRIVATE_QUESTION_JSON']
          missing = [name for name in required if not os.environ.get(name)]
          if missing: raise SystemExit('Missing configuration: ' + ', '.join(missing))
          with open(os.environ['GITHUB_ENV'], 'a') as file:
              file.write('AUTH_ORIGIN=https://' + os.environ['TF_VAR_domain'] + '\n')
          PY
      - uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
        with:
          node-version-file: .node-version
          cache: true
          run-install: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true
      - run: vp install --frozen-lockfile
      - run: vp check --no-fmt
      - run: vp run contracts:check
      - name: Validate sandbox admission policy
        run: go test ./apps/runner/internal/engine -run TestSandboxNoSwapEvidence -count=1
      - name: Check reusable validation
        id: validation
        env:
          GH_TOKEN: ${{ github.token }}
          VALIDATED_RUN_ID: ${{ vars.DEPLOY_VALIDATED_RUN }}
          PUBLISHED_IMAGE_RUN_ID: ${{ vars.DEPLOY_PUBLISHED_IMAGE_RUN }}
        run: python3 scripts/reuse-deployment-checks.py
      - name: Build Astro and React artifact
        if: steps.validation.outputs.reuse_image != 'true' && steps.validation.outputs.patch_image != 'true'
        run: |
          export QUOREM_SITE_URL="$AUTH_ORIGIN"
          export VITE_HOSTED_INTELLIGENCE=false
          export VITE_LANGUAGE_URL="${AUTH_ORIGIN/https:/wss:}/lsp"
          vp run build
          mkdir -p deploy/site deploy/images .local/deploy
          cp -R apps/web/dist/. deploy/site/
          python3 scripts/package-auth.py
      - name: Build isolated language images
        if: steps.validation.outputs.reuse_image != 'true' && steps.validation.outputs.patch_image != 'true'
        run: python3 scripts/build-judge-images.py
      - name: Validate application and judge
        if: steps.validation.outputs.reuse != 'true'
        env:
          QUOREM_TEST_DOCKER: "1"
        run: |
          vp -C apps/auth test
          vp -C apps/web test
          go test -p 1 ./...
      - name: Build application image
        if: steps.validation.outputs.reuse_image != 'true'
        run: |
          if [ "${{ steps.validation.outputs.patch_image }}" = true ]; then
            python3 scripts/build-runtime-image.py "${{ steps.validation.outputs.base_sha }}"
          else
            docker build --platform linux/amd64 -f deploy/Dockerfile -t "quorem-production:$GITHUB_SHA" .
          fi
      - name: Verify nested Docker isolation
        if: steps.validation.outputs.reuse_image != 'true'
        run: docker run --privileged --cgroupns=private --rm "quorem-production:$GITHUB_SHA" --verify-only
      - name: Push application image
        if: github.ref == 'refs/heads/main' && steps.validation.outputs.reuse_image != 'true'
        run: |
          image="registry.cloudflare.com/$CLOUDFLARE_ACCOUNT_ID/quorem-production:$GITHUB_SHA"
          docker tag "quorem-production:$GITHUB_SHA" "$image"
          vp -C apps/realtime-cloudflare exec wrangler containers push "$image"
          echo "TF_VAR_image=$image" >> "$GITHUB_ENV"
  deploy:
    concurrency:
      group: production-apply-${{ github.ref }}
      cancel-in-progress: false
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      IMAGE_REVISION: ${{ needs.build.outputs.image_sha }}
      NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
      TF_VAR_project_name: ${{ vars.NEON_PROJECT_NAME || 'quorem-production' }}
      TF_VAR_region: ${{ vars.NEON_REGION || 'aws-us-east-1' }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Require current main
        run: |
          main_revision="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [ "$main_revision" != "$GITHUB_SHA" ]; then
            echo "::error::Main advanced; deploy its current revision instead."
            exit 1
          fi
      - uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
        with:
          node-version-file: .node-version
          cache: true
          run-install: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: 1.13.5
          terraform_wrapper: false
      - run: vp install --frozen-lockfile
      - name: Configure image
        run: echo "TF_VAR_image=registry.cloudflare.com/$CLOUDFLARE_ACCOUNT_ID/quorem-production:$IMAGE_REVISION" >> "$GITHUB_ENV"
      - name: Initialize Terraform state
        if: github.ref == 'refs/heads/main'
        run: python3 scripts/terraform-state.py
      - name: Provision Neon
        run: python3 scripts/provision-database.py
      - name: Migrate and bootstrap operator
        if: github.ref == 'refs/heads/main'
        env:
          APP_ENV: production
          AUTH_MODE: password
          AUTH_PASSWORD_PRODUCTION: "true"
          AUTH_LOGIN_ONLY: "true"
          AUTH_BOOTSTRAP: "true"
          AUTH_BOOTSTRAP_EMAIL: ethanmngai@gmail.com
          AUTH_BOOTSTRAP_USERNAME: ethanmngai
          AUTH_BOOTSTRAP_NAME: Ethan Ngai
          AUTH_BOOTSTRAP_PASSWORD: ${{ secrets.AUTH_BOOTSTRAP_PASSWORD }}
          PRIVATE_QUESTION_JSON: ${{ secrets.PRIVATE_QUESTION_JSON }}
        run: |
          go build -o .local/deploy/provision ./apps/api/cmd/provision
          .local/deploy/provision
          vp -C apps/auth run migrate
          vp -C apps/auth exec node --experimental-strip-types src/bootstrap.ts
          python3 - <<'PY'
          import json, os
          question = json.loads(os.environ['PRIVATE_QUESTION_JSON'])
          path = '.local/deploy/private-question.json'
          with open(os.open(path, os.O_WRONLY | os.O_CREAT | os.O_TRUNC, 0o600), 'w') as file:
              json.dump(question, file)
          PY
          .local/deploy/provision --seed --private-question .local/deploy/private-question.json
      - name: Provision application and domain
        if: github.ref == 'refs/heads/main'
        run: |
          terraform -chdir=infra/terraform/app apply -input=false -auto-approve
      - name: Verify production routes
        if: github.ref == 'refs/heads/main'
        run: |
          curl --max-time 75 --retry 12 --retry-all-errors --retry-delay 10 --fail "$AUTH_ORIGIN/health"
          curl --fail --silent "$AUTH_ORIGIN/" -o /tmp/marketing.html
          curl --fail --silent "$AUTH_ORIGIN/practice" -o /tmp/workspace.html
          test "$(sha256sum /tmp/marketing.html | cut -d ' ' -f 1)" != "$(sha256sum /tmp/workspace.html | cut -d ' ' -f 1)"
          curl --fail "$AUTH_ORIGIN/v1/problems"
          curl --fail "$AUTH_ORIGIN/api/auth/quorem-config"
          test "$(curl --silent -o /dev/null -w '%{http_code}' "$AUTH_ORIGIN/internal/session/test")" = 404
          echo "Production: $AUTH_ORIGIN" >> "$GITHUB_STEP_SUMMARY"
