name: Deploy production
on:
  push:
    branches: [main]
    paths:
      - apps/api/**
      - apps/auth/**
      - apps/runner/**
      - apps/realtime-cloudflare/**
      - internal/**
      - fixtures/**
      - packages/contracts/**
      - infra/**
      - deploy/**
      - scripts/build-judge-images.py
      - scripts/cloudflare_api.py
      - scripts/configure-production-auth.ts
      - scripts/package-auth.py
      - scripts/provision-database.py
      - scripts/reconcile-judge.py
      - scripts/reconcile_judge_test.py
      - scripts/require-main.sh
      - scripts/reuse-validated-images.py
      - scripts/reuse_validated_images_test.py
      - scripts/terraform-state.py
      - scripts/test-direct-sandbox.py
      - scripts/upload-worker-version.py
      - scripts/upload_worker_version_test.py
      - scripts/verify-production-auth.py
      - scripts/verify_production_auth_test.py
      - scripts/verify-rollout.py
      - scripts/worker-migration-tag.py
      - scripts/worker-subdomain.py
      - go.mod
      - go.sum
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .node-version
      - .github/workflows/deploy.yaml
  workflow_dispatch:
    inputs:
      restart_objects:
        description: Redeploy the active Worker version and immediately update Durable Objects
        type: boolean
        default: false
      reuse_run_id:
        description: Completed production run whose verified images can be reused for an infrastructure-only retry
        required: false
        type: string
        default: ""
      validate_hosted:
        description: Validate an isolated temporary case sandbox from dev
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
env:
  AUTH_ORIGIN: https://${{ vars.PRODUCTION_DOMAIN || 'quorem.app' }}
  QUOREM_TEST_DATABASE_URL: postgres://quorem:quorem@127.0.0.1:54329/quorem_test?sslmode=disable
  AUTH_TEST_DATABASE_URL: postgres://quorem:quorem@127.0.0.1:54329/quorem_test?sslmode=disable
  TF_IN_AUTOMATION: "true"
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
  NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
  AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
  TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
  TF_VAR_account_id: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
  TF_VAR_zone_id: ${{ vars.CLOUDFLARE_ZONE_ID || secrets.CLOUDFLARE_ZONE_ID }}
  TF_VAR_domain: ${{ vars.PRODUCTION_DOMAIN || 'quorem.app' }}
  TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  TF_VAR_better_auth_secret: ${{ secrets.BETTER_AUTH_SECRET }}
  TF_VAR_auth_internal_secret: ${{ secrets.AUTH_INTERNAL_SECRET }}
  TF_VAR_invite_key: ${{ secrets.QUOREM_INVITE_KEY }}
  APP_ENV: local
  BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
  AUTH_INTERNAL_SECRET: ${{ secrets.AUTH_INTERNAL_SECRET }}
  QUOREM_INVITE_KEY: ${{ secrets.QUOREM_INVITE_KEY }}
  WRANGLER_SEND_METRICS: "false"
jobs:
  build:
    if: ${{ !inputs.reuse_run_id && !inputs.restart_objects }}
    outputs:
      image_sha: ${{ github.sha }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      HOSTED_ONLY: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/dev' && inputs.validate_hosted }}
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_USER: quorem
          POSTGRES_PASSWORD: quorem
          POSTGRES_DB: quorem_test
        ports:
          - 54329:5432
        options: >-
          --health-cmd "pg_isready -U quorem -d quorem_test"
          --health-interval 2s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Check deployment configuration
        if: github.ref == 'refs/heads/main'
        env:
          AUTH_BOOTSTRAP_PASSWORD: ${{ secrets.AUTH_BOOTSTRAP_PASSWORD }}
          PRIVATE_QUESTION_JSON: ${{ secrets.PRIVATE_QUESTION_JSON }}
        run: |
          python3 - <<'PY'
          import os
          required = ['CLOUDFLARE_API_TOKEN', 'CLOUDFLARE_ACCOUNT_ID', 'NEON_API_KEY',
                      'AWS_ACCESS_KEY_ID', 'AWS_SECRET_ACCESS_KEY', 'TF_VAR_zone_id',
                      'BETTER_AUTH_SECRET', 'AUTH_INTERNAL_SECRET', 'QUOREM_INVITE_KEY',
                      'AUTH_BOOTSTRAP_PASSWORD', 'PRIVATE_QUESTION_JSON']
          missing = [name for name in required if not os.environ.get(name)]
          if missing: raise SystemExit('Missing configuration: ' + ', '.join(missing))
          with open(os.environ['GITHUB_ENV'], 'a') as file:
              file.write('AUTH_ORIGIN=https://' + os.environ['TF_VAR_domain'] + '\n')
          PY
      - uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
        with:
          node-version-file: .node-version
          cache: true
          run-install: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true
      - run: vp install --frozen-lockfile
      - run: vp check --no-fmt
        if: env.HOSTED_ONLY != 'true'
      - run: vp run contracts:check
        if: env.HOSTED_ONLY != 'true'
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: 1.13.5
          terraform_wrapper: false
      - name: Validate Terraform configuration
        if: env.HOSTED_ONLY != 'true'
        run: |
          terraform fmt -check infra/terraform/app/main.tf infra/terraform/database/main.tf
          terraform -chdir=infra/terraform/app init -backend=false -input=false
          terraform -chdir=infra/terraform/app validate
          terraform -chdir=infra/terraform/app test
          terraform -chdir=infra/terraform/database init -backend=false -input=false
          terraform -chdir=infra/terraform/database validate
          terraform -chdir=infra/terraform/case-validation init -backend=false -input=false
          terraform -chdir=infra/terraform/case-validation validate
          terraform -chdir=infra/terraform/case-validation test
      - name: Validate elastic routing policy
        if: env.HOSTED_ONLY != 'true'
        run: |
          node --import ./deploy/test-register.mjs --test deploy/*.test.mjs
          python3 -m unittest discover -s scripts -p 'reconcile_judge_test.py'
          python3 -m unittest discover -s scripts -p 'upload_worker_version_test.py'
      - name: Validate workerd routing and WebSocket lifecycle
        if: env.HOSTED_ONLY != 'true'
        run: |
          mkdir -p .local
          vp -C apps/realtime-cloudflare exec wrangler dev --config ../../deploy/wrangler.test.jsonc --port 8791 --ip 127.0.0.1 --show-interactive-dev-session=false > .local/workerd.log 2>&1 &
          worker_pid=$!
          trap 'kill "$worker_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 120); do
            if curl --fail --silent http://localhost:8791/health > /dev/null; then break; fi
            sleep 1
          done
          if ! node deploy/workerd-check.mjs; then cat .local/workerd.log; exit 1; fi
      - name: Validate fast judge routing
        if: env.HOSTED_ONLY != 'true'
        run: |
          mkdir -p .local
          vp -C apps/realtime-cloudflare exec wrangler dev --config ../../deploy/wrangler.fast-test.jsonc --port 8796 --ip 127.0.0.1 --show-interactive-dev-session=false > .local/fast-workerd.log 2>&1 &
          worker_pid=$!
          trap 'kill "$worker_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 120); do
            if curl --fail --silent http://localhost:8796/health > /dev/null; then break; fi
            sleep 1
          done
          if ! QUOREM_WORKER_TEST_ORIGIN=http://localhost:8796 node deploy/workerd-check.mjs; then cat .local/fast-workerd.log; exit 1; fi
          if ! node deploy/workerd-case-check.mjs; then cat .local/fast-workerd.log; exit 1; fi
      - name: Package auth dependencies
        if: env.HOSTED_ONLY != 'true'
        run: |
          mkdir -p .local/deploy
          python3 scripts/package-auth.py
      - name: Build isolated language images
        run: python3 scripts/build-judge-images.py
      - name: Verify direct sandbox isolation
        run: |
          python3 scripts/test-direct-sandbox.py
          QUOREM_TEST_DIRECT_DOCKER=1 go test ./apps/runner/internal/engine -run TestRemoteSandboxPreflightWithDocker -count=1
      - name: Validate application and judge
        if: env.HOSTED_ONLY != 'true'
        env:
          QUOREM_TEST_DOCKER: "1"
        run: |
          vp -C apps/auth test
          vp -C apps/web test
          go test -p 1 ./...
      - name: Build application and judge images
        if: env.HOSTED_ONLY != 'true'
        run: |
          docker build --platform linux/amd64 -f deploy/Dockerfile -t "quorem-app:$GITHUB_SHA" .
          docker build --platform linux/amd64 -f deploy/Dockerfile.direct-judge -t "quorem-judge:$GITHUB_SHA" .
      - name: Verify split runtime roles
        if: env.HOSTED_ONLY != 'true'
        run: |
          docker run --rm "quorem-app:$GITHUB_SHA" --verify-only
          docker run --rm --entrypoint sh "quorem-app:$GITHUB_SHA" -c 'test ! -e /app/bin/runner && ! command -v docker && ! command -v dockerd'
          docker run --rm --entrypoint sh "quorem-judge:$GITHUB_SHA" -c 'test ! -e /app/bin/api && test ! -e /app/apps/auth && ! command -v docker && ! command -v dockerd && test -z "$BETTER_AUTH_SECRET$AUTH_INTERNAL_SECRET$QUOREM_INVITE_KEY$AUTH_DATABASE_URL"'
      - name: Push application and judge images
        if: github.ref == 'refs/heads/main'
        run: |
          for role in app judge; do
            image="registry.cloudflare.com/$CLOUDFLARE_ACCOUNT_ID/quorem-$role:$GITHUB_SHA"
            docker tag "quorem-$role:$GITHUB_SHA" "$image"
            vp -C apps/realtime-cloudflare exec wrangler containers push "$image"
          done
          for language in python java typescript ocaml postgresql; do
            image="registry.cloudflare.com/$CLOUDFLARE_ACCOUNT_ID/quorem-case-$language:$GITHUB_SHA"
            docker tag "quorem-case-$language:local" "$image"
            vp -C apps/realtime-cloudflare exec wrangler containers push "$image"
          done
      - name: Push temporary validation images
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/dev' && inputs.validate_hosted
        run: |
          cleanup_failed_push() {
            for language in python java typescript ocaml postgresql; do
              vp -C apps/realtime-cloudflare exec wrangler containers images delete "quorem-validation-$GITHUB_RUN_ID-$language:$GITHUB_SHA" -y >/dev/null 2>&1 || true
            done
          }
          trap cleanup_failed_push ERR
          for language in python java typescript ocaml postgresql; do
            image="registry.cloudflare.com/$CLOUDFLARE_ACCOUNT_ID/quorem-validation-$GITHUB_RUN_ID-$language:$GITHUB_SHA"
            docker tag "quorem-case-$language:local" "$image"
            vp -C apps/realtime-cloudflare exec wrangler containers push "$image"
          done
          trap - ERR

  validate-hosted-case:
    needs: build
    if: ${{ always() && !cancelled() && !inputs.restart_objects && ((github.ref == 'refs/heads/main' && (needs.build.result == 'success' || (inputs.reuse_run_id != '' && needs.build.result == 'skipped'))) || (github.ref == 'refs/heads/dev' && inputs.validate_hosted && needs.build.result == 'success')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TF_VAR_name: quorem-validation-${{ github.run_id }}
      TF_VAR_image_revision: ${{ github.sha }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
        with:
          node-version-file: .node-version
          cache: true
          run-install: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: 1.13.5
          terraform_wrapper: false
      - run: vp install --frozen-lockfile
      - name: Resolve production image revision
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          REUSE_RUN_ID: ${{ inputs.reuse_run_id }}
        run: |
          echo "TF_VAR_image_prefix=quorem-case" >> "$GITHUB_ENV"
          if [ -n "$REUSE_RUN_ID" ]; then
            python3 scripts/reuse-validated-images.py
            revision=$(sed -n 's/^IMAGE_REVISION=//p' "$GITHUB_ENV" | tail -1)
            echo "TF_VAR_image_revision=$revision" >> "$GITHUB_ENV"
          fi
      - name: Create temporary control token
        run: |
          token=$(openssl rand -hex 32)
          echo "::add-mask::$token"
          echo "TF_VAR_validation_token=$token" >> "$GITHUB_ENV"
          echo "QUOREM_TEST_DIRECT_TOKEN=$token" >> "$GITHUB_ENV"
      - name: Provision isolated validation resources
        run: |
          terraform -chdir=infra/terraform/case-validation init -input=false
          terraform -chdir=infra/terraform/case-validation apply -input=false -auto-approve
          echo "QUOREM_TEST_DIRECT_ORIGIN=$(terraform -chdir=infra/terraform/case-validation output -raw origin)" >> "$GITHUB_ENV"
      - name: Validate hosted case isolation and language behavior
        run: |
          mkdir -p .local
          vp -C apps/realtime-cloudflare exec wrangler tail "$TF_VAR_name" --format json 2>.local/case-tail.err | python3 -u -c '
          import json, re, sys
          allowed = re.compile(r"^case-lifecycle (?:stop-begin|destroy-complete|stop-complete|delete-begin|delete-complete|exec-ready (?:python|java|typescript|ocaml|postgresql)|streams-complete (?:python|java|typescript|ocaml|postgresql)|stream-failed (?:python|java|typescript|ocaml|postgresql))$")
          for line in sys.stdin:
              try:
                  event = json.loads(line)
                  for log in event.get("logs", []):
                      messages = log.get("message", [])
                      for message in [messages] if isinstance(messages, str) else messages:
                          if isinstance(message, str) and allowed.fullmatch(message): print(message, flush=True)
              except (ValueError, AttributeError, TypeError):
                  pass
          ' > .local/case-lifecycle.log &
          tail_pid=$!
          trap 'kill "$tail_pid" 2>/dev/null || true' EXIT
          ready=false
          for attempt in $(seq 1 60); do
            if curl --max-time 5 --silent --fail -X DELETE -H "Authorization: Bearer $QUOREM_TEST_DIRECT_TOKEN" "$QUOREM_TEST_DIRECT_ORIGIN/internal/case/readiness-probe" >/dev/null; then ready=true; break; fi
            sleep 2
          done
          test "$ready" = true
          if ! go test -v ./apps/runner/internal/engine -run '^TestRemoteSandboxHosted$' -count=1; then
            cat .local/case-lifecycle.log
            if [ ! -s .local/case-lifecycle.log ]; then
              echo "No lifecycle events received; tail stderr follows."
              cat .local/case-tail.err
            fi
            exit 1
          fi
      - name: Destroy temporary validation resources
        if: always()
        run: |
          if [ -d infra/terraform/case-validation/.terraform ]; then
            terraform -chdir=infra/terraform/case-validation destroy -input=false -auto-approve
          fi
      - name: Delete temporary validation images
        if: ${{ always() && github.ref == 'refs/heads/dev' }}
        run: |
          failed=false
          for language in python java typescript ocaml postgresql; do
            vp -C apps/realtime-cloudflare exec wrangler containers images delete "quorem-validation-$GITHUB_RUN_ID-$language:$GITHUB_SHA" -y || failed=true
          done
          test "$failed" = false

  deploy:
    concurrency:
      group: production-apply-${{ github.ref }}
      cancel-in-progress: false
    needs: [build, validate-hosted-case]
    if: ${{ always() && !cancelled() && needs.validate-hosted-case.result == 'success' && github.ref == 'refs/heads/main' && !inputs.restart_objects && (needs.build.result == 'success' || (github.event_name == 'workflow_dispatch' && inputs.reuse_run_id != '' && needs.build.result == 'skipped')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      IMAGE_REVISION: ${{ needs.build.outputs.image_sha }}
      NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
      TF_VAR_project_name: ${{ vars.NEON_PROJECT_NAME || 'quorem-production' }}
      TF_VAR_region: ${{ vars.NEON_REGION || 'aws-us-east-1' }}
      TF_VAR_max_compute_cu: ${{ vars.NEON_MAX_COMPUTE_CU || '4' }}
      TF_VAR_api_lossless_results: ${{ vars.QUOREM_API_LOSSLESS_RESULTS || 'false' }}
      TF_VAR_api_lossless_cases: ${{ vars.QUOREM_API_LOSSLESS_CASES || 'false' }}
      TF_VAR_judge_lossless_results: ${{ vars.QUOREM_JUDGE_LOSSLESS_RESULTS || 'false' }}
      TF_VAR_judge_lossless_cases: ${{ vars.QUOREM_JUDGE_LOSSLESS_CASES || 'false' }}
      TF_VAR_judge_resumable_execution: ${{ vars.QUOREM_JUDGE_RESUMABLE_EXECUTION || 'false' }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Require current main
        run: bash scripts/require-main.sh
      - name: Validate image reuse guard
        run: python3 -m unittest discover -s scripts -p 'reuse_validated_images_test.py'
      - name: Resolve verified image revision
        if: inputs.reuse_run_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          REUSE_RUN_ID: ${{ inputs.reuse_run_id }}
        run: python3 scripts/reuse-validated-images.py
      - uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
        with:
          node-version-file: .node-version
          cache: true
          run-install: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: 1.13.5
          terraform_wrapper: false
      - run: vp install --frozen-lockfile
      - name: Validate current routing policy
        run: node --import ./deploy/test-register.mjs --test deploy/*.test.mjs
      - name: Configure production email and social providers
        env:
          AUTH_MODE: ${{ vars.AUTH_MODE }}
          AUTH_EMAIL_DRIVER: ${{ vars.AUTH_EMAIL_DRIVER }}
          SMTP_HOST: ${{ vars.SMTP_HOST }}
          SMTP_PORT: ${{ vars.SMTP_PORT }}
          AUTH_EMAIL_SES_REGION: ${{ vars.AUTH_EMAIL_SES_REGION }}
          AUTH_EMAIL_CLOUDFLARE_ACCOUNT_ID: ${{ vars.AUTH_EMAIL_CLOUDFLARE_ACCOUNT_ID }}
          AUTH_EMAIL_CLOUDFLARE_API_TOKEN: ${{ secrets.AUTH_EMAIL_CLOUDFLARE_API_TOKEN }}
          COGNITO_CLIENT_ID: ${{ secrets.COGNITO_CLIENT_ID }}
          COGNITO_CLIENT_SECRET: ${{ secrets.COGNITO_CLIENT_SECRET }}
          COGNITO_DOMAIN: ${{ vars.COGNITO_DOMAIN }}
          COGNITO_REGION: ${{ vars.COGNITO_REGION }}
          COGNITO_USERPOOL_ID: ${{ vars.COGNITO_USERPOOL_ID }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          AUTH_EMAIL_FROM: ${{ vars.AUTH_EMAIL_FROM }}
          AUTH_GOOGLE_CLIENT_ID: ${{ secrets.AUTH_GOOGLE_CLIENT_ID }}
          AUTH_GOOGLE_CLIENT_SECRET: ${{ secrets.AUTH_GOOGLE_CLIENT_SECRET }}
          AUTH_GITHUB_CLIENT_ID: ${{ secrets.AUTH_GITHUB_CLIENT_ID }}
          AUTH_GITHUB_CLIENT_SECRET: ${{ secrets.AUTH_GITHUB_CLIENT_SECRET }}
        run: node --experimental-strip-types scripts/configure-production-auth.ts
      - name: Verify current workerd routing before reusing images
        if: inputs.reuse_run_id != ''
        run: |
          mkdir -p .local
          vp -C apps/realtime-cloudflare exec wrangler dev --config ../../deploy/wrangler.test.jsonc --port 8791 --ip 127.0.0.1 --show-interactive-dev-session=false > .local/reused-workerd.log 2>&1 &
          worker_pid=$!
          trap 'kill "$worker_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 120); do
            if curl --fail --silent http://localhost:8791/health > /dev/null; then break; fi
            sleep 1
          done
          if ! node deploy/workerd-check.mjs; then cat .local/reused-workerd.log; exit 1; fi
      - name: Configure image
        run: |
          echo "TF_VAR_image=registry.cloudflare.com/$CLOUDFLARE_ACCOUNT_ID/quorem-app:$IMAGE_REVISION" >> "$GITHUB_ENV"
          echo "TF_VAR_judge_image=registry.cloudflare.com/$CLOUDFLARE_ACCOUNT_ID/quorem-judge:$IMAGE_REVISION" >> "$GITHUB_ENV"
          echo "TF_VAR_case_image_revision=$IMAGE_REVISION" >> "$GITHUB_ENV"
      - name: Initialize Terraform state
        if: github.ref == 'refs/heads/main'
        run: python3 scripts/terraform-state.py
      - name: Provision Neon
        run: python3 scripts/provision-database.py
      - name: Migrate and bootstrap operator
        if: github.ref == 'refs/heads/main'
        env:
          APP_ENV: production
          AUTH_MODE: password
          AUTH_PASSWORD_PRODUCTION: "true"
          AUTH_LOGIN_ONLY: "true"
          AUTH_BOOTSTRAP: "true"
          AUTH_BOOTSTRAP_EMAIL: ethanmngai@gmail.com
          AUTH_BOOTSTRAP_USERNAME: ethanmngai
          AUTH_BOOTSTRAP_NAME: Ethan Ngai
          AUTH_BOOTSTRAP_PASSWORD: ${{ secrets.AUTH_BOOTSTRAP_PASSWORD }}
          PRIVATE_QUESTION_JSON: ${{ secrets.PRIVATE_QUESTION_JSON }}
        run: |
          go build -o .local/deploy/provision ./apps/api/cmd/provision
          .local/deploy/provision
          vp -C apps/auth run migrate
          vp -C apps/auth exec node --experimental-strip-types src/bootstrap.ts
          python3 - <<'PY'
          import json, os
          question = json.loads(os.environ['PRIVATE_QUESTION_JSON'])
          path = '.local/deploy/private-question.json'
          with open(os.open(path, os.O_WRONLY | os.O_CREAT | os.O_TRUNC, 0o600), 'w') as file:
              json.dump(question, file)
          PY
          .local/deploy/provision --seed --private-question .local/deploy/private-question.json
      - name: Provision application and domain
        if: github.ref == 'refs/heads/main'
        run: |
          terraform -chdir=infra/terraform/app apply -input=false -auto-approve -lock-timeout=5m
      - name: Wait for target rollout
        run: python3 scripts/verify-rollout.py
      - name: Wake authoritative jobs after role rollout
        if: github.ref == 'refs/heads/main'
        run: python3 scripts/reconcile-judge.py
      - name: Verify production routes
        if: github.ref == 'refs/heads/main'
        run: |
          curl_args=(--max-time 75 --retry 6 --retry-all-errors --retry-delay 2 --fail --silent --show-error)
          curl "${curl_args[@]}" "$AUTH_ORIGIN/health"
          curl "${curl_args[@]}" "$AUTH_ORIGIN/" -o /tmp/marketing.html
          curl "${curl_args[@]}" "$AUTH_ORIGIN/practice" -o /tmp/workspace.html
          test "$(sha256sum /tmp/marketing.html | cut -d ' ' -f 1)" != "$(sha256sum /tmp/workspace.html | cut -d ' ' -f 1)"
          curl "${curl_args[@]}" "$AUTH_ORIGIN/v1/problems" -o /tmp/problems.json
          curl "${curl_args[@]}" "$AUTH_ORIGIN/api/auth/quorem-config" -o /tmp/auth-config.json
          test "$(curl --silent -o /dev/null -w '%{http_code}' "$AUTH_ORIGIN/internal/session/test")" = 404
          echo "Production: $AUTH_ORIGIN" >> "$GITHUB_STEP_SUMMARY"
      - name: Verify production sign-in, API latency and revocation
        env:
          AUTH_BOOTSTRAP_USERNAME: ethanmngai
          AUTH_BOOTSTRAP_PASSWORD: ${{ secrets.AUTH_BOOTSTRAP_PASSWORD }}
        run: |
          python3 -m unittest discover -s scripts -p 'verify_production_auth_test.py'
          python3 scripts/verify-production-auth.py

  restart:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.restart_objects }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: production-apply-refs/heads/main
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af
        with:
          node-version-file: .node-version
          cache: true
          run-install: false
      - run: vp install --frozen-lockfile
      - name: Redeploy current version with immediate object updates
        run: |
          vp -C apps/realtime-cloudflare exec wrangler deployments list --name quorem-production --json > "$RUNNER_TEMP/deployments.json"
          version=$(python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); v=d[-1]["versions"]; assert len(v)==1 and v[0]["percentage"]==100; print(v[0]["version_id"])' "$RUNNER_TEMP/deployments.json")
          vp -C apps/realtime-cloudflare exec wrangler versions deploy "$version@100" --name quorem-production --durable-objects-code-update-mode immediate --message 'Restart production objects on current version' --yes
      - name: Roll existing application configuration
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          base = 'https://api.cloudflare.com/client/v4/accounts/' + os.environ['CLOUDFLARE_ACCOUNT_ID'] + '/containers/applications'
          headers = {'Authorization': 'Bearer ' + os.environ['CLOUDFLARE_API_TOKEN'], 'Content-Type': 'application/json'}
          def request(path, data=None):
              req = urllib.request.Request(base + path, headers=headers, data=None if data is None else json.dumps(data).encode())
              return json.load(urllib.request.urlopen(req))['result']
          apps = request('')
          app = next(item for item in apps if item['name'] == 'quorem-production')
          config = request('/' + app['id'])['configuration']
          config = {key: config[key] for key in ('image', 'vcpu', 'memory_mib', 'disk', 'environment_variables') if key in config}
          rollout = request('/' + app['id'] + '/rollouts', {'description': 'Restart with current configuration', 'strategy': 'rolling', 'kind': 'full_auto', 'step_percentage': 100, 'target_configuration': config})
          print('Restart rollout:', rollout['id'])
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write('RESTART_APPLICATION_ID=' + app['id'] + '\n')
              output.write('RESTART_ROLLOUT_ID=' + rollout['id'] + '\n')
          PY
      - name: Wait for replacement containers
        run: |
          python3 - <<'PY'
          import json, os, time, urllib.request
          url = ('https://api.cloudflare.com/client/v4/accounts/' + os.environ['CLOUDFLARE_ACCOUNT_ID']
                 + '/containers/applications/' + os.environ['RESTART_APPLICATION_ID']
                 + '/rollouts/' + os.environ['RESTART_ROLLOUT_ID'])
          req = urllib.request.Request(url, headers={'Authorization': 'Bearer ' + os.environ['CLOUDFLARE_API_TOKEN']})
          for attempt in range(120):
              result = json.load(urllib.request.urlopen(req))['result']
              status = result['status']
              if status == 'completed':
                  print('Container rollout completed')
                  break
              if status in ('reverted', 'replaced', 'failed'):
                  raise SystemExit('Container rollout ended: ' + status)
              time.sleep(5)
          else:
              raise SystemExit('Container rollout did not complete within 10 minutes')
          PY
