name: Refresh learned recommendations
on:
  workflow_dispatch:
    inputs:
      action:
        type: choice
        options: [evaluate, measure, train, activate]
        default: evaluate
      model_id:
        description: Validated model UUID or prior for rollback
        type: string
        default: ""
  schedule:
    - cron: "23 5 * * 1"
permissions:
  contents: read
concurrency:
  group: recommendation-maintenance
  cancel-in-progress: false
jobs:
  maintain:
    if: github.ref == 'refs/heads/main' && vars.QUOREM_LEARNED_RECOMMENDATIONS == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76
        with:
          node-version-file: .node-version
          cache: true
          run-install: false
      - run: vp install --frozen-lockfile
      - name: Run requested recommendation maintenance
        env:
          DATABASE_URL: ${{ secrets.QUOREM_RECOMMENDATION_DATABASE_URL }}
          RECOMMENDATION_ACTION: ${{ inputs.action || 'train' }}
          RECOMMENDATION_MODEL: ${{ inputs.model_id }}
        run: vp -C apps/api exec node src/cli/recommendations.ts "$RECOMMENDATION_ACTION" "$RECOMMENDATION_MODEL"
