name: Deploy production API
on:
  workflow_dispatch:
    inputs:
      action:
        type: choice
        options: [inspect, private-workers, api-update]
        default: inspect
        required: true
      preserve_execution_scope:
        description: Repair the current protocol without discarding stranded attempt fences
        type: boolean
        default: false
      judge_validation_run:
        description: Successful CI run for changed judge image sources
        type: string
        required: false
      release_sha:
        type: string
        required: true
permissions:
  contents: read
  actions: read
concurrency:
  group: hono-production-cutover
  cancel-in-progress: false
env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
  AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
  TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
  BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
  GH_TOKEN: ${{ github.token }}
jobs:
  inspect:
    if: inputs.action == 'inspect' && inputs.release_sha == github.sha && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76
        with:
          node-version-file: .node-version
          cache: true
          run-install: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e
        with:
          terraform_version: 1.17.1
          terraform_wrapper: false
      - run: vp install --frozen-lockfile
      - run: vp exec node scripts/hono-production-inspect.mjs
  private-workers:
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'private-workers' && inputs.release_sha == github.sha && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      HONO_RELEASE_SHA: ${{ inputs.release_sha }}
      HONO_JUDGE_VALIDATION_RUN: ${{ inputs.judge_validation_run }}
      HONO_PRESERVE_JUDGING_SCOPE: ${{ inputs.preserve_execution_scope }}
      CLOUDFLARE_ZONE_ID: ${{ vars.CLOUDFLARE_ZONE_ID }}
      AUTH_BOOTSTRAP_USERNAME: ${{ vars.AUTH_BOOTSTRAP_USERNAME }}
      AUTH_BOOTSTRAP_PASSWORD: ${{ secrets.AUTH_BOOTSTRAP_PASSWORD }}
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76
        with:
          node-version-file: .node-version
          cache: true
          run-install: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e
        with:
          terraform_version: 1.17.1
          terraform_wrapper: false
      - run: vp install --frozen-lockfile
      - run: node scripts/build-hono-service-workers.mjs
      - run: vp exec node scripts/hono-production-private-workers.mjs
  api-update:
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'api-update' && inputs.release_sha == github.sha && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HONO_RELEASE_SHA: ${{ inputs.release_sha }}
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76
        with:
          node-version-file: .node-version
          cache: true
          run-install: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e
        with:
          terraform_version: 1.17.1
          terraform_wrapper: false
      - run: vp install --frozen-lockfile
      - run: vp exec node scripts/hono-production-api-release.mjs
