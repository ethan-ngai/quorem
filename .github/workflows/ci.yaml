name: CI
on:
  pull_request:
    branches: [main, "feat/hono-*", "fix/hono-*", "test/hono-*", "refactor/hono-*"]
  push:
    branches: [feat/hono-migration]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      mailpit:
        image: axllent/mailpit:v1.27.4@sha256:df6c2541907e1be6fac21f509927cf6ed771617a1f4b361ef66d97bd05593d2d
        ports:
          - 51025:1025
          - 58025:8025
        options: >-
          --health-cmd "/mailpit readyz"
          --health-interval 2s --health-timeout 3s --health-retries 30
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_USER: quorem
          POSTGRES_PASSWORD: quorem
          POSTGRES_DB: quorem
        ports:
          - 54329:5432
        options: >-
          --health-cmd "pg_isready -U quorem -d quorem"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      APP_ENV: local
      QUOREM_TEST_DATABASE_URL: postgres://quorem:quorem@localhost:54329/quorem?sslmode=disable
      AUTH_TEST_DATABASE_URL: postgres://quorem:quorem@localhost:54329/quorem?sslmode=disable
      AUTH_TEST_MAILPIT_URL: http://127.0.0.1:58025
      QUOREM_TEST_DOCKER: "1"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
        with:
          node-version-file: .node-version
          cache: true
          run-install: false
      - run: vp install --frozen-lockfile
      - name: Formatting (advisory)
        id: formatting
        continue-on-error: true
        run: vp fmt --check
      - name: Report formatting advisory
        if: steps.formatting.outcome == 'failure'
        run: |
          echo '::warning::Formatting check failed. Run vp fmt to fix formatting; this does not block CI.'
          echo '### Formatting advisory' >> "$GITHUB_STEP_SUMMARY"
          echo 'Formatting check failed. See the formatting step output; run `vp fmt` locally to fix it. This does not block CI.' >> "$GITHUB_STEP_SUMMARY"
      - name: Lint and type checks
        run: vp check --no-fmt
      - run: vp run contracts:check
      - run: vp -C apps/api run typecheck
      - run: vp -C apps/api run check:boundaries
      - run: vp -C apps/api run test
      - run: vp -C apps/api run test:workers
      - name: Portable runner transport and stream lifetimes
        run: vp -C apps/runner exec node --test src/queue/http.test.ts src/sandbox/remote.test.ts src/engine/stream-lifetime.test.ts
      - name: Canonical questions and identity runtime tests
        run: |
          vp -C packages/questions run typecheck
          vp -C packages/questions run test
          vp -C packages/questions run test:workerd
          vp -C packages/execution run typecheck
          vp -C packages/execution run test
          vp -C packages/execution run test:workerd
          vp -C apps/api run test:identity:node
          vp -C apps/api run test:identity:workers
      - name: Isolated native database fixtures
        run: |
          for database in quorem_hono_schema_test quorem_hono_primitives_test quorem_hono_identity_test quorem_hono_catalog_test quorem_hono_workspace_test quorem_hono_scheduling_test quorem_hono_admission_test quorem_hono_result_stream_test quorem_hono_cli_test quorem_hono_runtime_test; do
            docker exec "${{ job.services.postgres.id }}" createdb -U quorem "$database"
          done
          # Match server-major archive tools; only disposable fixtures enter /tmp.
          mkdir -p "$RUNNER_TEMP/quorem-pg-tools"
          for command in pg_dump pg_restore; do
            cat > "$RUNNER_TEMP/quorem-pg-tools/$command" <<'SH'
          #!/bin/sh
          exec docker run --rm --network host --user "$(id -u):$(id -g)" --volume /tmp:/tmp postgres:17.6-alpine "$(basename "$0")" "$@"
          SH
            chmod +x "$RUNNER_TEMP/quorem-pg-tools/$command"
          done
          echo "$RUNNER_TEMP/quorem-pg-tools" >> "$GITHUB_PATH"
      - name: Native PostgreSQL schema and transaction contracts
        env:
          QUOREM_SCHEMA_TEST_DATABASE_URL: postgres://quorem:quorem@127.0.0.1:54329/quorem_hono_schema_test?sslmode=disable
          QUOREM_TEST_DATABASE_URL: postgres://quorem:quorem@127.0.0.1:54329/quorem_hono_primitives_test?sslmode=disable
          QUOREM_IDENTITY_TEST_DATABASE_URL: postgres://quorem:quorem@127.0.0.1:54329/quorem_hono_identity_test?sslmode=disable
          QUOREM_CATALOG_TEST_DATABASE_URL: postgres://quorem:quorem@127.0.0.1:54329/quorem_hono_catalog_test?sslmode=disable
        run: |
          vp -C packages/database run typecheck
          vp -C packages/database run test
          vp -C packages/database run test:integration
          vp -C apps/api run test:identity
          vp -C apps/api run test:catalog
          vp -C apps/api run test:catalog:workers
      - name: Workspace ownership and Odyssey contracts
        env:
          QUOREM_WORKSPACE_TEST_DATABASE_URL: postgres://quorem:quorem@127.0.0.1:54329/quorem_hono_workspace_test?sslmode=disable
        run: |
          vp -C apps/api exec node --test src/adapters/postgres/workspace/integration.ts
          vp -C apps/api exec vitest run --config src/adapters/postgres/workspace/vitest.workers.config.ts
      - name: Durable deadline scheduling contracts
        env:
          DATABASE_URL: postgres://quorem:quorem@127.0.0.1:54329/quorem_hono_scheduling_test?sslmode=disable
          QUOREM_SCHEDULING_TEST_DATABASE_URL: postgres://quorem:quorem@127.0.0.1:54329/quorem_hono_scheduling_test?sslmode=disable
        run: |
          vp -C packages/database run migrate product ../../apps/api/migrations
          vp -C apps/api exec vitest run --config src/adapters/postgres/events/scheduling/vitest.config.ts
          vp -C apps/api exec vitest run --config src/adapters/postgres/events/scheduling/vitest.workers.config.ts
      - name: Execution admission and recovery contracts
        env:
          QUOREM_ADMISSION_TEST_DATABASE_URL: postgres://quorem:quorem@127.0.0.1:54329/quorem_hono_admission_test?sslmode=disable
        run: |
          vp -C apps/api exec vitest run --config src/adapters/postgres/judging/admission/vitest.config.ts
          vp -C apps/api exec vitest run --config src/adapters/postgres/judging/admission/vitest.workers.config.ts
      - name: Bounded authorized result streaming
        env:
          QUOREM_RESULTS_TEST_DATABASE_URL: postgres://quorem:quorem@127.0.0.1:54329/quorem_hono_result_stream_test?sslmode=disable
        run: |
          vp -C apps/api exec node --test src/adapters/postgres/judging/results/integration.ts
          vp -C apps/api exec vitest run --config src/adapters/postgres/judging/results/vitest.workers.config.ts
      - name: Workerd PostgreSQL connection lifecycle
        env:
          WRANGLER_SEND_METRICS: "false"
          CLOUDFLARE_HYPERDRIVE_LOCAL_CONNECTION_STRING_DB: postgres://quorem:quorem@127.0.0.1:54329/quorem_hono_primitives_test?sslmode=disable
        run: |
          vp -C apps/api exec wrangler dev --local --config ../../packages/database/wrangler.test.jsonc --ip 127.0.0.1 --port 18136 > /tmp/quorem-db-worker.log 2>&1 &
          worker_pid=$!
          trap 'kill -TERM "$worker_pid" 2>/dev/null || true; wait "$worker_pid" || true' EXIT
          for attempt in $(seq 1 100); do
            if curl -fsS http://127.0.0.1:18136/ > /dev/null; then break; fi
            if ! kill -0 "$worker_pid" 2>/dev/null; then cat /tmp/quorem-db-worker.log; exit 1; fi
            sleep 0.1
          done
          vp -C packages/database run test:workers
      - name: Isolated auth fixture
        run: |
          docker exec "${{ job.services.postgres.id }}" createdb -U quorem quorem_hono_auth_native_test
          docker exec "${{ job.services.postgres.id }}" createdb -U quorem quorem_hono_profile_test
      - run: vp -C apps/auth run typecheck
      - run: vp -C apps/auth test
        env:
          AUTH_TEST_DATABASE_URL: postgres://quorem:quorem@127.0.0.1:54329/quorem_hono_auth_native_test?sslmode=disable
          PROFILE_TEST_DATABASE_URL: postgres://quorem:quorem@127.0.0.1:54329/quorem_hono_profile_test?sslmode=disable
      - run: vp -C apps/web test
      - run: vp node --test scripts/marketing-dev.test.mjs
      - run: vp run build
      - name: Canonical operator fixtures
        env:
          QUOREM_CLI_TEST_DATABASE_URL: postgres://quorem:quorem@127.0.0.1:54329/quorem_hono_cli_test?sslmode=disable
        run: vp -C apps/api exec vitest run --config src/cli/vitest.config.ts
      - run: docker build -f apps/language/Dockerfile -t quorem-language:local .
      - name: Language lifecycle and Python capabilities
        env:
          QUOREM_DEV_IDENTITY: "true"
          QUOREM_LANGUAGE_TEST: "true"
          QUOREM_HOSTED_INTELLIGENCE: "true"
        run: |
          (cd apps/language && exec node --experimental-strip-types src/main.ts) > /tmp/quorem-language.log 2>&1 &
          language_pid=$!
          trap 'kill -TERM "$language_pid" 2>/dev/null || true; wait "$language_pid" || true' EXIT
          for attempt in $(seq 1 100); do
            if curl -fsS http://127.0.0.1:8081/health; then break; fi
            if ! kill -0 "$language_pid" 2>/dev/null; then cat /tmp/quorem-language.log; exit 1; fi
            sleep 0.1
          done
          curl -fsS http://127.0.0.1:8081/health
          vp run --filter @quorem/language test
          vp -C apps/web test src/features/editor/languageIntegration.test.ts
      - run: python3 scripts/build-judge-images.py --base-only
      - name: Mandatory composed runtime release validation
        env:
          QUOREM_RUNTIME_TEST_URL: postgres://quorem:quorem@127.0.0.1:54329/quorem_hono_runtime_test?sslmode=disable
          QUOREM_TEST_DOCKER_SOCKET: /var/run/docker.sock
          WRANGLER_SEND_METRICS: "false"
        run: vp -C apps/api exec node src/runtime/composition/run-validation.mjs
      - name: Native SQL practice and selected-match execution
        run: node scripts/hono-sql-validation.mjs
      - name: Native match and result socket workload fixture
        run: node scripts/hono-workload-validation.mjs
      - name: Mandatory container runner release validation
        run: node scripts/hono-container-validation.mjs

  hono-platform-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
        with:
          node-version-file: .node-version
          cache: true
          run-install: false
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: 1.13.5
          terraform_wrapper: false
      - run: vp install --frozen-lockfile
      - name: Build private service fixture images
        run: |
          docker build -f deploy/hono/Dockerfile.runner --target private-service -t quorem-35d-private-fixture:local .
          docker build -f deploy/hono/services/Dockerfile.image -t quorem-35f-image-fixture:local .
      - name: Staged orchestration and private service contracts
        run: |
          node scripts/hono-stage-validation.mjs
          node scripts/hono-recovery-validation.mjs
          node --import ./deploy/test-register.mjs --test deploy/hono/services/*.test.mjs
      - name: Isolated Terraform module contracts
        run: |
          for stack in hono-bootstrap hono-stage hono-services; do
            terraform -chdir=infra/terraform/$stack fmt -check -recursive
            terraform -chdir=infra/terraform/$stack init -backend=false -input=false
            terraform -chdir=infra/terraform/$stack validate
            terraform -chdir=infra/terraform/$stack test
          done
          node --test infra/terraform/hono-bootstrap/tests/rest-identity.test.mjs
