name: Diagnose production
on:
  workflow_dispatch:
    inputs:
      sql:
        description: Measure practice SQL using a read-only production connection
        type: boolean
        default: false
      hyperdrive:
        description: Read Hyperdrive timing and pool metrics for benchmark_start
        type: boolean
        default: false
      benchmark_start:
        description: UTC start time of a completed Python benchmark
        type: string
        default: ""
      diagnostics:
        description: Read judging state and probe the private command path
        type: boolean
        default: false
      workload:
        description: Eight temporary users, twenty fast cases, strict five-second SSE target
        type: boolean
        default: false
      benchmark:
        description: Run five one-case Python samples against the active judge
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  logs:
    if: ${{ !inputs.sql && !inputs.benchmark && !inputs.workload && !inputs.diagnostics && !inputs.hyperdrive && inputs.benchmark_start == '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Read container startup logs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python3 scripts/container-logs.py --minutes 30 --stdout
  hyperdrive:
    if: ${{ inputs.hyperdrive && inputs.benchmark_start != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Read production Hyperdrive metrics
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          QUOREM_BENCHMARK_START: ${{ inputs.benchmark_start }}
        run: python3 scripts/hono-production-hyperdrive-metrics.py
  sql:
    if: ${{ inputs.sql || (inputs.benchmark_start != '' && !inputs.hyperdrive) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
        with:
          node-version-file: .node-version
          cache: true
          run-install: false
      - run: vp install --frozen-lockfile
      - name: Measure production SELECT execution and round trips
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
          NEON_DATABASE_NAME: ${{ vars.NEON_DATABASE_NAME }}
          QUOREM_BENCHMARK_START: ${{ inputs.benchmark_start }}
        run: python3 scripts/profile-production-sql.py
  benchmark:
    if: github.ref == 'refs/heads/dev' && (inputs.benchmark || inputs.workload || inputs.diagnostics)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      HONO_RELEASE_SHA: ${{ github.sha }}
      JUDGING_WORKLOAD: ${{ inputs.workload }}
      JUDGING_DIAGNOSTICS: ${{ inputs.diagnostics }}
      BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      AUTH_BOOTSTRAP_USERNAME: ${{ vars.AUTH_BOOTSTRAP_USERNAME }}
      AUTH_BOOTSTRAP_PASSWORD: ${{ secrets.AUTH_BOOTSTRAP_PASSWORD }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af
        with:
          node-version-file: .node-version
          cache: true
          run-install: false
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd
        with:
          terraform_version: 1.13.5
          terraform_wrapper: false
      - run: vp install --frozen-lockfile
      - run: vp exec node scripts/hono-production-private-workers.mjs --benchmark-only
