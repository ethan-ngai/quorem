name: Diagnose production
on:
  workflow_dispatch:
    inputs:
      sql:
        description: Measure practice SQL using a read-only production connection
        type: boolean
        default: false
      benchmark_start:
        description: UTC start time of a completed Python benchmark
        type: string
        default: ""
      wake_trace_start:
        description: UTC start of a two-minute judging wake trace
        type: string
        default: ""
      benchmark:
        description: Run five one-case Python samples against the active judge
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  logs:
    if: ${{ inputs.wake_trace_start != '' || (!inputs.sql && !inputs.benchmark && inputs.benchmark_start == '') }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Read Cloudflare judge logs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
          WAKE_TRACE_START: ${{ inputs.wake_trace_start }}
        run: |
          if [[ -n "$WAKE_TRACE_START" ]]; then
            python3 scripts/container-logs.py --wake-trace-start "$WAKE_TRACE_START" --limit 1000
          else
            python3 scripts/container-logs.py --minutes 30 --stdout
          fi
  sql:
    if: ${{ inputs.sql || inputs.benchmark_start != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
        with:
          node-version-file: .node-version
          cache: true
          run-install: false
      - run: vp install --frozen-lockfile
      - name: Measure production SELECT execution and round trips
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
          NEON_DATABASE_NAME: ${{ vars.NEON_DATABASE_NAME }}
          QUOREM_BENCHMARK_START: ${{ inputs.benchmark_start }}
        run: python3 scripts/profile-production-sql.py
  benchmark:
    if: github.ref == 'refs/heads/dev' && inputs.benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      HONO_RELEASE_SHA: ${{ github.sha }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      AUTH_BOOTSTRAP_USERNAME: ${{ vars.AUTH_BOOTSTRAP_USERNAME }}
      AUTH_BOOTSTRAP_PASSWORD: ${{ secrets.AUTH_BOOTSTRAP_PASSWORD }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af
        with:
          node-version-file: .node-version
          cache: true
          run-install: false
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd
        with:
          terraform_version: 1.13.5
          terraform_wrapper: false
      - run: vp install --frozen-lockfile
      - run: vp exec node scripts/hono-production-private-workers.mjs --benchmark-only
