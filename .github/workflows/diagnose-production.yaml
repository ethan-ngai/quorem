name: Diagnose production
on:
  workflow_dispatch:
    inputs:
      mail:
        description: Read-only authenticated SMTP relay health probe
        type: boolean
        default: false
      sql:
        description: Measure practice SQL using a read-only production connection
        type: boolean
        default: false
      hyperdrive:
        description: Read Hyperdrive timing and pool metrics for benchmark_start
        type: boolean
        default: false
      benchmark_start:
        description: UTC start time of a completed Python benchmark
        type: string
        default: ""
      match_id:
        description: Read persisted judge phases for one production match
        type: string
        default: ""
      probe_match_sandboxes:
        description: Read authenticated diagnostics for the match's failed sandbox attempts
        type: boolean
        default: false
      replay_match:
        description: Replay the published suite in a disposable production match
        type: boolean
        default: false
      worker_log_start:
        description: UTC start of a 30-minute historical Worker diagnostics window
        type: string
        default: ""
      diagnostics:
        description: Read judging state and probe the private command path
        type: boolean
        default: false
      workload:
        description: Eight temporary users, twenty fast cases, strict five-second SSE target
        type: boolean
        default: false
      benchmark:
        description: Run five one-case Python samples against the active judge
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  logs:
    if: ${{ !inputs.mail && !inputs.sql && !inputs.benchmark && !inputs.workload && !inputs.diagnostics && !inputs.hyperdrive && inputs.benchmark_start == '' && (inputs.match_id == '' || inputs.worker_log_start != '') }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Read container startup logs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
          QUOREM_WORKER_LOG_START: ${{ inputs.worker_log_start }}
        run: |
          if [ -n "$QUOREM_WORKER_LOG_START" ]; then
            python3 scripts/production-worker-logs.py
          else
            python3 scripts/container-logs.py --minutes 30 --stdout
          fi
  hyperdrive:
    if: ${{ inputs.hyperdrive && inputs.benchmark_start != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Read production Hyperdrive metrics
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          QUOREM_BENCHMARK_START: ${{ inputs.benchmark_start }}
        run: python3 scripts/hono-production-hyperdrive-metrics.py
  sql:
    if: ${{ inputs.match_id != '' || inputs.sql || (inputs.benchmark_start != '' && !inputs.hyperdrive) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
        with:
          node-version-file: .node-version
          cache: true
          run-install: false
      - run: vp install --frozen-lockfile
      - name: Measure production SELECT execution and round trips
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
          NEON_DATABASE_NAME: ${{ vars.NEON_DATABASE_NAME }}
          QUOREM_BENCHMARK_START: ${{ inputs.benchmark_start }}
          QUOREM_DIAGNOSTIC_MATCH_ID: ${{ inputs.match_id }}
        run: python3 scripts/profile-production-sql.py
  benchmark:
    if: github.ref == 'refs/heads/dev' && (inputs.benchmark || inputs.workload || inputs.diagnostics || ((inputs.probe_match_sandboxes || inputs.replay_match) && inputs.match_id != ''))
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      HONO_RELEASE_SHA: ${{ github.sha }}
      JUDGING_WORKLOAD: ${{ inputs.workload }}
      JUDGING_DIAGNOSTICS: ${{ inputs.diagnostics }}
      QUOREM_REPLAY_MATCH: ${{ inputs.replay_match && inputs.match_id || '' }}
      QUOREM_SANDBOX_PROBE_MATCH: ${{ inputs.probe_match_sandboxes && inputs.match_id || '' }}
      BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      AUTH_BOOTSTRAP_USERNAME: ${{ vars.AUTH_BOOTSTRAP_USERNAME }}
      AUTH_BOOTSTRAP_PASSWORD: ${{ secrets.AUTH_BOOTSTRAP_PASSWORD }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af
        with:
          node-version-file: .node-version
          cache: true
          run-install: false
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd
        with:
          terraform_version: 1.13.5
          terraform_wrapper: false
      - run: vp install --frozen-lockfile
      - run: vp exec node scripts/hono-production-private-workers.mjs --benchmark-only

  mail:
    if: inputs.mail
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af
        with:
          node-version-file: .node-version
          cache: true
          run-install: false
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd
        with:
          terraform_version: 1.13.5
          terraform_wrapper: false
      - run: node scripts/hono-production-mail-probe.mjs
