name: Diagnose production
on:
  workflow_dispatch:
    inputs:
      sql:
        description: Measure practice SQL using a read-only production connection
        type: boolean
        default: false
      validation_run_id:
        description: Read allowlisted lifecycle logs for a validation run
        type: string
        default: ""
permissions:
  contents: read
jobs:
  logs:
    if: ${{ !inputs.sql }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Read container startup logs
        if: inputs.validation_run_id == ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python3 scripts/container-logs.py --minutes 30 --stdout
      - name: Read validation lifecycle logs
        if: inputs.validation_run_id != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
          VALIDATION_RUN_ID: ${{ inputs.validation_run_id }}
        run: python3 scripts/case-logs.py
  sql:
    if: ${{ inputs.sql }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Build read-only SQL profiler
        run: |
          mkdir -p .local
          go build -o .local/profile-reads ./apps/api/cmd/profile-reads
      - name: Measure production SELECT execution and round trips
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
          NEON_DATABASE_NAME: ${{ vars.NEON_DATABASE_NAME }}
        run: python3 scripts/profile-production-sql.py
