<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (() => {
        let preference = "system";
        try {
          preference = JSON.parse(localStorage.getItem("quorem.theme.v1") || '"system"');
        } catch {}
        document.documentElement.dataset.theme =
          preference === "dark" ||
          (preference !== "light" && matchMedia("(prefers-color-scheme: dark)").matches)
            ? "dark"
            : "light";
      })();
    </script>
    <style>
      html {
        background: oklch(1 0 0);
      }
      html[data-theme="dark"] {
        background: oklch(0.18 0.004 255);
        color-scheme: dark;
      }
    </style>
    <meta name="theme-color" content="#f5f6f8" />
    <link rel="icon" data-favicon="ico" href="/favicon.ico?v=2" sizes="16x16 32x32 48x48 96x96" />
    <link
      rel="icon"
      data-favicon="png"
      type="image/png"
      href="/favicon-96x96.png?v=2"
      sizes="96x96"
    />
    <link rel="icon" data-favicon="svg" type="image/svg+xml" href="/favicon.svg" sizes="any" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180" />
    <link rel="mask-icon" href="/safari-pinned-tab.svg" color="#000000" />
    <script src="/favicon-theme.js?v=2" defer></script>
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="application-name" content="Quorem" />
    <meta name="apple-mobile-web-app-title" content="Quorem" />
    <meta name="msapplication-config" content="/browserconfig.xml" />
    <!-- site-seo -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
