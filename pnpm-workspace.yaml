packages:
  - apps/*
  - packages/*
patchedDependencies:
  # Bound ZIP record copies in the bundled typeshed filesystem; see intelligence-model.md.
  monaco-pyright-lsp@0.1.7: patches/monaco-pyright-lsp@0.1.7.patch
  # Upstream node-postgres PR 3806: close must not surface its cancelled read.
  pg-cloudflare@1.4.1: patches/pg-cloudflare@1.4.1.patch
overrides:
  vite: npm:@voidzero-dev/vite-plus-core@1.5.0
  vitest: 5.1.0
allowBuilds:
  esbuild: true
  sharp: true
  workerd: true

catalog:
  "@better-auth/passkey": "1.7.17"
  "@cloudflare/vitest-plugin": "1.5.1"
  "@codemirror/state": "6.7.6"
  "@fontsource-variable/geist": "5.3.0"
  "@fontsource/jetbrains-mono": "5.3.0"
  "@tanstack/react-query": "5.105.3"
  "@types/node": "24.19.2"
  "@types/pg": "8.23.1"
  "@types/react": "19.3.0"
  "@types/react-dom": "19.3.0"
  "@types/ws": "8.18.2"
  "ajv": "8.20.0"
  "ajv-formats": "3.0.1"
  "better-auth": "1.7.17"
  "drizzle-orm": "0.45.4"
  "hono": "4.13.16"
  "pg": "8.23.1"
  "react": "19.3.1"
  "react-dom": "19.3.1"
  "typescript": "6.0.3"
  "vite-plus": "1.5.0"
  "vitest": "5.1.0"
  "wrangler": "4.157.0"
  "ws": "8.22.1"

peerDependencyRules:
  allowedVersions:
    # Vite+ publishes Vite 8.3.5 with its own package version.
    vite: "1.5.0"
    # Contract generation and reproducibility checks validate this compiler API.
    "openapi-typescript@7.13.0>typescript": "6.0.3"
